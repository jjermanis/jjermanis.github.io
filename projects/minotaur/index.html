<body>

<div id="topRow">
    <div id="title">MINOTAUR</div>
</div>
<div id="container">
    <canvas id="view3d" width="400" height="400"></canvas>
    <canvas id="view2d" width="400" height="400"></canvas>
</div>
<div id="statusRow">
    <div id="status"></div>
    <span id="muteBtn" title="Mute" style="cursor:pointer; font-size:24px; user-select:none;">🔊</span>
    <button id="resetBtn" class="ui-button" disabled style="display:none;">New Game</button></div>
<script>
let SIZE;
let CELL;
const STATE_PLAYING = 0;
const STATE_DEFEATED = 1;
const STATE_VICTORY = 2;
const FOV = Math.PI / 3;
const RAYS = 200;
const DEFAULT_WALL_COLOR = { r:130, g:140, b:160 };
const WALL_MIN_LIGHT = 0.20;
const SKY_COLORS = [
    { r: 79,  g: 195, b: 247 },  // Sunnny sky
    { r: 120, g: 200, b: 240 },  // Slightly darker
    { r: 150, g: 160, b: 200 },  // Muted dusk
    { r: 255, g: 120, b: 80 },   // Sunset orange
    { r: 10, g: 15, b: 40 }      // Night Time
];
const MAX_LIGHT_DIST = 14;
//Small maps size for easy testing
//const SIZE_OPTIONS = [4, 4, 4, 4, 4];
//const CELL_OPTIONS = [100, 100, 100, 100, 100];
const SIZE_OPTIONS = [8, 10, 16, 20, 25];
const CELL_OPTIONS = [50, 40, 25, 20, 16];
const MINOTAUR_STEP_TIMES = [460, 320, 260, 220, 200];

let levelIndex = 0;
let victoryFadeStart = 0;
let isMuted = false;

let minotaurVisible = false;
let minotaurActive = false;
let minotaurHasSeenPlayer = false;
let minotaurTimerStarted = false;
let minotaurStartTime = 0;
let minotaurPath = [];
let minotaurLastMoveTime = 0;
let minotaurStepDelay = MINOTAUR_STEP_TIMES[0]; 
const minotaurImg = new Image();
minotaurImg.src = "minotaur.png";

SIZE = SIZE_OPTIONS[levelIndex];
CELL = CELL_OPTIONS[levelIndex];

// Core state (allocated once)
const maze = [];
const wallColors = [];
const seen = [];

const player = {
    x: 0,
    y: 0,
    dir: 1,
    escaped: false,
    defeated: false,
};
const minotaur = {
    x: 0,
    y: 0,
    dir: 1,
};

// Contexts
const ctx3 = view3d.getContext("2d");
const ctx2 = view2d.getContext("2d");
const statusEl = document.getElementById("status");
const resetBtn = document.getElementById("resetBtn");

let selectedVoice = null;

function selectMinotaurVoice() {
    const voices = speechSynthesis.getVoices();

    const preferredVoiceNames = [
        "Google UK English Female",
        "Google español de Estados Unidos",
        "Google français",
    ];

    for (const preferred of preferredVoiceNames) {
        const found = voices.find(v => v.name === preferred);
        if (found) {
            selectedVoice = found;
            return;
        }
    }

    // Fallback if none found
    selectedVoice = voices[0] || null;
}

// DFS maze generation
function dfs(x, y) {
    maze[y][x].visited = true;
    for (let d of [0,1,2,3].sort(()=>Math.random()-0.5)) {
        const nx = x + [0,1,0,-1][d];
        const ny = y + [-1,0,1,0][d];
        if (nx>=0 && ny>=0 && nx<SIZE && ny<SIZE && !maze[ny][nx].visited) {
            maze[y][x].walls[d] = 0;
            maze[ny][nx].walls[(d+2)%4] = 0;
            dfs(nx, ny);
        }
    }
}

/* ============================
   INIT / RESET GAME
   ============================ */
function initGame() {

    selectMinotaurVoice();
    // Build maze + wall colors
    for (let y = 0; y < SIZE; y++) {
        maze[y] = [];
        wallColors[y] = [];
        seen[y] = [];
        for (let x = 0; x < SIZE; x++) {
            maze[y][x] = { visited:false, walls:[1,1,1,1] };
            wallColors[y][x] = [
                { ...DEFAULT_WALL_COLOR },
                { ...DEFAULT_WALL_COLOR },
                { ...DEFAULT_WALL_COLOR },
                { ...DEFAULT_WALL_COLOR }
            ];
            seen[y][x] = false;
        }
    }

    // Generate maze
    dfs(0, 0);

    // Exit walls (lower-right)
    wallColors[SIZE-1][SIZE-1][1] = { r:0, g:180, b:0 };
    wallColors[SIZE-1][SIZE-1][2] = { r:0, g:180, b:0 };

    // Reset player
    player.x = 0;
    player.y = 0;
    player.dir = 1;
    player.escaped = false;
    player.defeated = false;

    // --- Reset Minotaur State ---
    minotaurVisible = false;
    minotaurActive = false;
    minotaurHasSeenPlayer = false;
    minotaurTimerStarted = false;
    minotaurStartTime = 0;

    // Reset position (invisible until triggered)
    minotaur.x = 0;
    minotaur.y = 0;
    minotaur.dir = 1;  // face right at start

    // UI reset
    statusEl.textContent = "";
    resetBtn.disabled = true;
    resetBtn.style.display = "none";
    gameState = STATE_PLAYING;

    minotaurStepDelay = MINOTAUR_STEP_TIMES[levelIndex];
}

function advanceLevel() {
    if (levelIndex < SIZE_OPTIONS.length - 1) {
        levelIndex++;
    } else {
        levelIndex = 0;
    }
    SIZE = SIZE_OPTIONS[levelIndex];
    CELL = CELL_OPTIONS[levelIndex];
    initGame();
}

function restartGame() {
    levelIndex = 0;
    SIZE = SIZE_OPTIONS[levelIndex];
    CELL = CELL_OPTIONS[levelIndex];
    initGame();
}

function updateMinotaurTimer() {
    if (!minotaurTimerStarted) return;
    if (player.escaped) return;
    if (player.defeated) return;

    const gridSize = SIZE; // assuming square grid
    const elapsedSeconds = (performance.now() - minotaurStartTime) / 1000;

    // Appear at (0,0) first...
    if (!minotaurVisible && elapsedSeconds >= gridSize * 0.3) {
        minotaurSpeak("awake");
        minotaurVisible = true;
        minotaur.x = 0;
        minotaur.y = 0;
    }

    // ... and later become active
    if (!minotaurActive && elapsedSeconds >= gridSize * 0.7) {
        minotaurSpeak("go");
        minotaurActive = true;
    }
}

function computeMinotaurPath() {

    const visited = Array.from({ length: SIZE }, () =>
        Array(SIZE).fill(false)
    );

    const parent = Array.from({ length: SIZE }, () =>
        Array(SIZE).fill(null)
    );

    const queue = [];

    queue.push({ x: minotaur.x, y: minotaur.y });
    visited[minotaur.y][minotaur.x] = true;

    // MUST match DFS wall ordering
    const directions = [
        { dx: 0, dy: -1, wallIndex: 0 }, // top
        { dx: 1, dy: 0,  wallIndex: 1 }, // right
        { dx: 0, dy: 1,  wallIndex: 2 }, // bottom
        { dx: -1, dy: 0, wallIndex: 3 }  // left
    ];

    let found = false;

    while (queue.length > 0) {
        const current = queue.shift();

        if (current.x === player.x && current.y === player.y) {
            found = true;
            break;
        }

        for (const dir of directions) {

            const nx = current.x + dir.dx;
            const ny = current.y + dir.dy;

            if (
                nx >= 0 && nx < SIZE &&
                ny >= 0 && ny < SIZE &&
                !visited[ny][nx] &&
                maze[current.y][current.x].walls[dir.wallIndex] === 0
            ) {
                visited[ny][nx] = true;
                parent[ny][nx] = current;
                queue.push({ x: nx, y: ny });
            }
        }
    }

    if (!found) return [];

    const path = [];
    let step = { x: player.x, y: player.y };

    while (!(step.x === minotaur.x && step.y === minotaur.y)) {
        path.push(step);
        step = parent[step.y][step.x];
    }

    path.reverse();
    return path;
}

function updateMinotaurMovement() {

    if (!minotaurVisible) return;
    if (!minotaurActive) return;

    const now = performance.now();

    if (now - minotaurLastMoveTime < minotaurStepDelay) return;

    minotaurLastMoveTime = now;

    // Recompute path if needed
    if (
        minotaurPath.length === 0 ||
        minotaurPath[minotaurPath.length - 1].x !== player.x ||
        minotaurPath[minotaurPath.length - 1].y !== player.y
    ) {
        minotaurPath = computeMinotaurPath();
    }

    if (minotaurPath.length === 0) return;

    const nextStep = minotaurPath[0];

    const dx = nextStep.x - minotaur.x;
    const dy = nextStep.y - minotaur.y;

    // Convert dx/dy to direction index
    let requiredDir;

    if (dx === 1) requiredDir = 1;
    else if (dx === -1) requiredDir = 3;
    else if (dy === 1) requiredDir = 2;
    else if (dy === -1) requiredDir = 0;
    else return; // should never happen

    // If facing correct direction → move
    if (minotaur.dir === requiredDir) {

        minotaur.x = nextStep.x;
        minotaur.y = nextStep.y;

        minotaurPath.shift(); // consume step
    } else {
        // Turn only (costs a tick)
        minotaur.dir = requiredDir;
    }
}

function checkMinotaurCollision() {
    if (!minotaurActive) return;

    if (
        player.x === minotaur.x &&
        player.y === minotaur.y
    ) {
        minotaurSpeak("eat.. eat");
        enterDefeatState();
    }
}

function checkMinotaurVision() {
    if (!minotaurActive) return;
    if (player.defeated || player.escaped) return;
    if (minotaurHasSeenPlayer) return;

    if (hasLineOfSight()) {
        minotaurHasSeenPlayer = true;
        minotaurSpeak("food");
    }
}

function minotaurSpeak(text) {
    if (!selectedVoice) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = selectedVoice;
    utterance.pitch = 0.1;   // slightly deeper
    utterance.rate = 0.5;    // slightly slower
    utterance.volume = 1.0;

    if (!isMuted) speechSynthesis.speak(utterance);
}

function hasLineOfSight() {
    if (!minotaurVisible) return false;

    // Start at minotaur center
    const startX = minotaur.x + 0.5;
    const startY = minotaur.y + 0.5;

    // Target is player center
    const targetX = player.x + 0.5;
    const targetY = player.y + 0.5;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const angle = Math.atan2(dy, dx);

    const sin = Math.sin(angle);
    const cos = Math.cos(angle);

    let prevX = startX;
    let prevY = startY;

    // Distance between them
    const maxDist = Math.sqrt(dx * dx + dy * dy);

    for (let t = 0; t < maxDist; t += 0.02) {

        const x = startX + cos * t;
        const y = startY + sin * t;

        const cx = Math.floor(x);
        const cy = Math.floor(y);

        // Out of bounds = blocked
        if (cx < 0 || cy < 0 || cx >= SIZE || cy >= SIZE) {
            return false;
        }

        const cell = maze[cy][cx];

        // EXACT same wall detection as castRay
        if (
            (cell.walls[0] && y < cy + 0.01) ||
            (cell.walls[2] && y > cy + 0.99) ||
            (cell.walls[3] && x < cx + 0.01) ||
            (cell.walls[1] && x > cx + 0.99)
        ) {
            return false;
        }

        // If we've entered the player's cell → visible
        if (cx === player.x && cy === player.y) {
            return true;
        }

        prevX = x;
        prevY = y;
    }

    return false;
}

/* ============================
   RAYCASTING
   ============================ */
function castRay(angle) {
    const sin = Math.sin(angle);
    const cos = Math.cos(angle);
    let prevX = player.x + 0.5;
    let prevY = player.y + 0.5;

    for (let t = 0; t < 20; t += 0.02) {
        const x = player.x + 0.5 + cos * t;
        const y = player.y + 0.5 + sin * t;
        const cx = Math.floor(x);
        const cy = Math.floor(y);

        if (cx < 0 || cy < 0 || cx >= SIZE || cy >= SIZE) {
            let wall;
            if (cx < 0) wall = 3;
            else if (cx >= SIZE) wall = 1;
            else if (cy < 0) wall = 0;
            else wall = 2;
            return { dist:t, cellX:Math.floor(prevX), cellY:Math.floor(prevY), wall };
        }

        const cell = maze[cy][cx];
        if (
            (cell.walls[0] && y < cy + 0.01) ||
            (cell.walls[2] && y > cy + 0.99) ||
            (cell.walls[3] && x < cx + 0.01) ||
            (cell.walls[1] && x > cx + 0.99)
        ) {
            return {
                dist:t,
                cellX:cx,
                cellY:cy,
                wall:(y<cy+0.01?0:y>cy+0.99?2:x<cx+0.01?3:1)
            };
        }

        seen[cy][cx] = true;
        prevX = x;
        prevY = y;
    }
    return { dist:20, cellX:0, cellY:0, wall:0 };
}

/* ============================
   DRAWING
   ============================ */
function draw3D() {

    if (gameState === STATE_DEFEATED) {
        drawDefeatScreen();
        return;
    }

    if (gameState === STATE_VICTORY) {
        drawVictoryScreen();
        return;
    }

    // --- SKY & FLOOR ---
    const sky = SKY_COLORS[levelIndex];
    ctx3.fillStyle = `rgb(${sky.r}, ${sky.g}, ${sky.b})`;
    ctx3.fillRect(0, 0, 400, 167);
    ctx3.fillStyle = "rgb(120, 80, 40)";
    ctx3.fillRect(0, 167, 400, 233);

    const baseAngle = player.dir * Math.PI / 2 - Math.PI / 2;

    const wallDepthBuffer = new Array(RAYS);

    // =====================================================
    // STEP 1: DRAW WALLS + STORE DEPTH
    // =====================================================
    for (let i = 0; i < RAYS; i++) {

        const angle = baseAngle + (i / RAYS - 0.5) * FOV;

        const hit = castRay(angle);

        const rawDist = Math.max(hit.dist, 0.0001);

        // Perpendicular correction
        const correctedDist =
            rawDist * Math.cos(angle - baseAngle);

        wallDepthBuffer[i] = correctedDist;

        const h = 360 / correctedDist;

        const light = Math.max(WALL_MIN_LIGHT, 1 - rawDist / MAX_LIGHT_DIST);
        const c = wallColors[hit.cellY][hit.cellX][hit.wall];

        ctx3.fillStyle =
            `rgb(${(c.r * light) | 0},${(c.g * light) | 0},${(c.b * light) | 0})`;

        ctx3.fillRect(i * 2, 167 - h / 2, 2, h);
    }

    // =====================================================
    // STEP 2: DRAW MINOTAUR WITH DEPTH TEST
    // =====================================================
    if (!minotaurVisible) return;

    const mx = minotaur.x + 0.5;
    const my = minotaur.y + 0.5;

    const px = player.x + 0.5;
    const py = player.y + 0.5;

    const dx = mx - px;
    const dy = my - py;

    const rawDistance = Math.sqrt(dx * dx + dy * dy);

    const angleToMinotaur = Math.atan2(dy, dx);

    let angleDiff = angleToMinotaur - baseAngle;

    while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
    while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

    if (Math.abs(angleDiff) > FOV / 2) return;

    const spriteDistance =
        rawDistance * Math.cos(angleDiff);

    if (spriteDistance <= 0.05) return;

    // Projection size
    const wallHeight = 360 / spriteDistance;
    const spriteHeight = wallHeight * (10 / 12);
    const spriteWidth =
        spriteHeight *
        (minotaurImg.width / minotaurImg.height);

    const horizonY = 167;
    const groundY = horizonY + wallHeight / 2;

    const spriteTop = groundY - spriteHeight;

    const screenCenterX =
        (0.5 + angleDiff / FOV) * 400;

    const spriteLeft =
        screenCenterX - spriteWidth / 2;

    const spriteRight =
        screenCenterX + spriteWidth / 2;

    // Convert sprite horizontal span to ray indices
    for (let stripeX = spriteLeft; stripeX < spriteRight; stripeX += 2) {

        const rayIndex = Math.floor(stripeX / 2);

        if (rayIndex < 0 || rayIndex >= RAYS)
            continue;

        // Depth test against wall
        if (spriteDistance < wallDepthBuffer[rayIndex]) {

            const texX =
                ((stripeX - spriteLeft) / spriteWidth) *
                minotaurImg.width;

            ctx3.drawImage(
                minotaurImg,
                texX, 0, 1, minotaurImg.height,
                stripeX, spriteTop, 2, spriteHeight
            );
        }
    }
}

function draw2D() {
    if (gameState === STATE_VICTORY) {
        ctx2.fillStyle = "rgb(56, 142, 60)";
        ctx2.fillRect(0, 0, 400, 400);
        return;
    }
    ctx2.fillStyle = "rgb(120, 80, 40)";
    ctx2.fillRect(0,0,400,400);
    ctx2.strokeStyle = "rgb(110, 130, 140)";
    ctx2.lineWidth = 2;

    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++) {
        const px=x*CELL, py=y*CELL;
        if (!seen[y][x]) {
            ctx2.fillStyle = "#555";
            ctx2.fillRect(px,py,CELL,CELL);
            continue;
        }
        const w = maze[y][x].walls;
        if (x===SIZE-1 && y===SIZE-1) {
            if (w[0]) ctx2.beginPath(),ctx2.moveTo(px,py),ctx2.lineTo(px+CELL,py),ctx2.stroke();
            if (w[3]) ctx2.beginPath(),ctx2.moveTo(px,py),ctx2.lineTo(px,py+CELL),ctx2.stroke();
            continue;
        }
        if (w[0]) ctx2.beginPath(),ctx2.moveTo(px,py),ctx2.lineTo(px+CELL,py),ctx2.stroke();
        if (w[1]) ctx2.beginPath(),ctx2.moveTo(px+CELL,py),ctx2.lineTo(px+CELL,py+CELL),ctx2.stroke();
        if (w[2]) ctx2.beginPath(),ctx2.moveTo(px,py+CELL),ctx2.lineTo(px+CELL,py+CELL),ctx2.stroke();
        if (w[3]) ctx2.beginPath(),ctx2.moveTo(px,py),ctx2.lineTo(px,py+CELL),ctx2.stroke();
    }

    if (!player.escaped && gameState === STATE_PLAYING) {
        ctx2.save();
        ctx2.translate(player.x*CELL + CELL/2, player.y*CELL + CELL/2);
        ctx2.rotate(player.dir * Math.PI/2 - Math.PI/2);
        ctx2.fillStyle = "#aaa";

        const tip = CELL * 0.4;
        const wing = CELL * 0.3;

        ctx2.beginPath();
        ctx2.moveTo(tip, 0);
        ctx2.lineTo(-wing, wing);
        ctx2.lineTo(-wing, -wing);
        ctx2.fill();

        ctx2.restore();
    }
    if (minotaurVisible) {
        drawMinotaur2D();
    }
}

function drawMinotaur2D() {
    const cx = minotaur.x * CELL + CELL / 2;
    const cy = minotaur.y * CELL + CELL / 2;

    const headRadius = CELL * 0.22;   // similar to original strong head
    const hornLength = CELL * 0.18;   // horizontal part
    const hornThickness = CELL * 0.10;
    const hornTipHeight = CELL * 0.30;


    const snoutWidth = CELL * 0.32;
    const snoutHeight = CELL * 0.20;

    ctx2.save();
    ctx2.translate(cx, cy);
    ctx2.fillStyle = "#888";

    /*
        LEFT HORN - RECTANGLE
    */
    ctx2.fillRect(
        -headRadius - hornLength,
        -hornThickness / 2,
        hornLength,
        hornThickness
    );

    /*
        LEFT HORN - TRIANGLE (pointing up)
    */
    ctx2.beginPath();
    ctx2.moveTo(-headRadius - hornLength, -hornThickness / 2);
    ctx2.lineTo(-headRadius - hornLength, -hornTipHeight);
    ctx2.lineTo(-headRadius - hornLength + hornThickness, -hornThickness / 2);
    ctx2.closePath();
    ctx2.fill();

    /*
        RIGHT HORN - RECTANGLE
    */
    ctx2.fillRect(
        headRadius,
        -hornThickness / 2,
        hornLength,
        hornThickness
    );

    /*
        RIGHT HORN - TRIANGLE (pointing up)
    */
    ctx2.beginPath();
    ctx2.moveTo(headRadius + hornLength, -hornThickness / 2);
    ctx2.lineTo(headRadius + hornLength, -hornTipHeight);
    ctx2.lineTo(headRadius + hornLength - hornThickness, -hornThickness / 2);
    ctx2.closePath();
    ctx2.fill();

    /*
        HEAD (stronger presence)
    */
    ctx2.beginPath();
    ctx2.arc(0, 0, headRadius, 0, Math.PI * 2);
    ctx2.fill();

    /*
        SNOUT
    */
    ctx2.fillRect(
        -snoutWidth / 2,
        headRadius * 0.3,
        snoutWidth,
        snoutHeight
    );

    ctx2.restore();
}

function drawVictoryScreen() {
    // Sky (light blue)
    ctx3.fillStyle = "rgb(135, 206, 235)";
    ctx3.fillRect(0, 0, 400, 167);

    // Ground (green grass)
    ctx3.fillStyle = "rgb(56, 142, 60)";
    ctx3.fillRect(0, 167, 400, 233);

    // --- Hills (behind forest, sitting on horizon) ---
    ctx3.fillStyle = "rgb(76, 153, 0)";
    ctx3.beginPath();
    ctx3.ellipse(100, 167, 130, 70, 0, Math.PI, 0);
    ctx3.fill();
    ctx3.beginPath();
    ctx3.ellipse(220, 167, 160, 95, 0, Math.PI, 0);
    ctx3.fill();
    ctx3.beginPath();
    ctx3.ellipse(340, 167, 120, 60, 0, Math.PI, 0);
    ctx3.fill();

    // --- Forest (dark tree line in front of hills) ---
    const treeData = [
        {x:-12, w:30, h:62},
        {x:10,  w:28, h:55}, {x:30,  w:32, h:70}, {x:55,  w:26, h:48},
        {x:72,  w:30, h:62}, {x:95,  w:34, h:75}, {x:118, w:28, h:58},
        {x:138, w:36, h:68}, {x:162, w:30, h:80}, {x:185, w:32, h:65},
        {x:208, w:28, h:72}, {x:228, w:34, h:58}, {x:252, w:30, h:76},
        {x:274, w:36, h:63}, {x:298, w:28, h:70}, {x:318, w:32, h:55},
        {x:340, w:30, h:68}, {x:362, w:26, h:60}, {x:380, w:34, h:72},
    ];
    for (const t of treeData) {
        ctx3.fillStyle = "rgb(62, 39, 35)";
        ctx3.fillRect(t.x + t.w * 0.4, 167 - 12, t.w * 0.2, 14);
        ctx3.fillStyle = "rgb(27, 94, 32)";
        ctx3.beginPath();
        ctx3.moveTo(t.x + t.w / 2, 167 - t.h);
        ctx3.lineTo(t.x, 167 - 8);
        ctx3.lineTo(t.x + t.w, 167 - 8);
        ctx3.closePath();
        ctx3.fill();
    }

    // --- Gold ingot stack (5 wide x 4 rows = 20 ingots) ---
    const ingotW = 28, ingotH = 10, ingotGap = 1;
    const totalRows = 6;
    const baseY = 310;

    for (let row = 0; row < totalRows; row++) {
        const cols = totalRows - row;
        const stackW = cols * (ingotW + ingotGap) - ingotGap;
        const stackX = (400 - stackW) / 2;
        const iy = baseY - row * (ingotH + ingotGap);

        for (let col = 0; col < cols; col++) {
            const ix = stackX + col * (ingotW + ingotGap);
            ctx3.fillStyle = "rgb(212, 175, 55)";
            ctx3.fillRect(ix, iy, ingotW, ingotH);
            ctx3.fillStyle = "rgb(255, 223, 100)";
            ctx3.fillRect(ix + 2, iy + 1, ingotW - 4, 3);
            ctx3.fillStyle = "rgb(160, 120, 20)";
            ctx3.fillRect(ix, iy + ingotH - 3, ingotW, 3);
            ctx3.fillStyle = "rgb(180, 140, 30)";
            ctx3.fillRect(ix, iy, 2, ingotH);
        }
    }
    const elapsed = performance.now() - victoryFadeStart;
    const alpha = Math.max(0, 1 - elapsed / 1000);
    if (alpha > 0) {
        ctx3.fillStyle = `rgba(0, 0, 0, ${alpha})`;
        ctx3.fillRect(0, 0, 400, 400);
    }
}

function playVictoryTune() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [
        {f:261.6, d:0.10, t:0.00},
        {f:329.6, d:0.10, t:0.00},
        {f:392.0, d:0.10, t:0.00},

        {f:261.6, d:0.10, t:0.22},
        {f:329.6, d:0.10, t:0.22},
        {f:392.0, d:0.10, t:0.22},

        {f:329.6, d:0.10, t:0.44},
        {f:415.3, d:0.10, t:0.44},
        {f:523.3, d:0.10, t:0.44},

        {f:349.2, d:0.65, t:0.70},
        {f:440.0, d:0.65, t:0.70},
        {f:523.3, d:0.65, t:0.70},
    ];
    notes.forEach(note => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(note.f, ctx.currentTime + note.t);
        gain.gain.setValueAtTime(0, ctx.currentTime + note.t);
        gain.gain.linearRampToValueAtTime(0.09, ctx.currentTime + note.t + 0.015);
        gain.gain.setValueAtTime(0.09, ctx.currentTime + note.t + note.d - 0.02);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + note.t + note.d + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + note.t);
        osc.stop(ctx.currentTime + note.t + note.d + 0.1);
    });
}

function drawDefeatScreen() {

    // Sky background
    const sky = SKY_COLORS[levelIndex];
    ctx3.fillStyle = `rgb(${sky.r}, ${sky.g}, ${sky.b})`;
    ctx3.fillRect(0, 0, 400, 400);

    const topMargin = -30;

    // Image bottom at bottom of canvas
    const targetHeight = 630 - topMargin;

    const aspect = minotaurImg.width / minotaurImg.height;
    const targetWidth = targetHeight * aspect;

    const x = (400 - targetWidth) / 2;
    const y = topMargin;

    ctx3.drawImage(
        minotaurImg,
        x,
        y,
        targetWidth,
        targetHeight
    );
}

function enterDefeatState() {

    if (gameState !== STATE_PLAYING) return;

    gameState = STATE_DEFEATED;

    player.defeated = true;
    minotaurActive = false;

    statusEl.textContent = "You are defeated.";
    resetBtn.textContent = "New Game";
    resetBtn.disabled = false;
    resetBtn.style.display = "block";
}

/* ============================
   INPUT / LOOP
   ============================ */
document.addEventListener("keydown", e => {
    if (e.key === "Enter" && resetBtn.style.display === "block") {
        resetBtn.click();
        return;
    }
    if (player.escaped) return;
    if (player.defeated) return;
    if (e.key==="ArrowLeft") player.dir = (player.dir+3)%4;
    if (e.key==="ArrowRight") player.dir = (player.dir+1)%4;
    if (e.key==="ArrowUp") {
        const dx=[0,1,0,-1][player.dir];
        const dy=[-1,0,1,0][player.dir];
        if (!maze[player.y][player.x].walls[player.dir]) {
            player.x+=dx; 
            player.y+=dy;

            if (!minotaurTimerStarted && (player.x !== 0 || player.y !== 0)) {
                minotaurTimerStarted = true;
                minotaurStartTime = performance.now();
            }

            if (player.x===SIZE-1 && player.y===SIZE-1) {
                player.escaped=true;
    		minotaurActive = false;
                if (levelIndex < SIZE_OPTIONS.length - 1) {
                    statusEl.textContent = "You Escaped!";
                    resetBtn.textContent = "Next Level";
                } else {
                    statusEl.textContent = "You Win!";
                    resetBtn.textContent = "New Game";
                    victoryFadeStart = performance.now();
                    gameState = STATE_VICTORY;
                    if (!isMuted) playVictoryTune();
                }
                resetBtn.disabled=false;
    	        resetBtn.style.display = "block";
            }
        }
    }
});

resetBtn.addEventListener("click", () => {
    if (gameState === STATE_DEFEATED || gameState === STATE_VICTORY) {
        restartGame();
    } else {
        advanceLevel();
    }
});

document.getElementById('muteBtn').addEventListener('click', () => {
    isMuted = !isMuted;
    document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
});

speechSynthesis.onvoiceschanged = function() {
    selectMinotaurVoice();
};

function loop() {
    if (gameState === STATE_PLAYING) {

        updateMinotaurTimer();
        updateMinotaurMovement();
        checkMinotaurVision();
        checkMinotaurCollision();
    }

    draw3D();
    draw2D();

    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
