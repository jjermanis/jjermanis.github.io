
<style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  body { margin: 0; }
  #app {
    min-height: 500px;
    background: #1a4a8a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: 'Inter', sans-serif;
    box-sizing: border-box;
  }
  #title {
    font-size: 28px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: #fff;
    margin: 0 0 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #record {
    font-size: 15px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: rgba(255,255,255,0.8);
    margin: 0 0 1rem;
    letter-spacing: 1px;
  }
  #status-top {
    height: 32px;
    font-size: 16px;
    font-weight: 500;
    color: #ffdd66;
    margin-bottom: 12px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
    background: #fff;
    border: 6px solid #fff;
    border-radius: 8px;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: #1a4a8a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
    transition: background 0.1s;
  }
  .cell:hover:not(.taken) { background: #1e5099; }
  .cell.taken { cursor: default; }
  .cell .x { color: #3cb54a; }
  .cell .o { color: #e84040; }
  #status-bottom {
    height: 32px;
    font-size: 16px;
    font-weight: 500;
    color: #ffdd66;
    margin-top: 12px;
  }
  #restart-btn {
    margin-top: 20px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 500;
    background: transparent;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: background 0.15s;
  }
  #restart-btn:hover { background: rgba(255,255,255,0.15); }
  .win-line { background: rgba(255,255,100,0.25) !important; }

  /* License MIT used in this file */
  #license {
      position: fixed;
      bottom: 5px;
      right: 10px;
      font-size: 10px;
      opacity: 0.5;
  }
  #license a {
      color: inherit;
      text-decoration: none;
  }
  #license a:hover {
      text-decoration: underline;
  }  
  /* License */

</style>
<div id="app">
  <h2 id="title">Tic Tac Toe</h2>
  <div id="record">Record: 0-0-0</div>
  <div id="status-top"></div>
  <div id="grid"></div>
  <div id="status-bottom">Your Turn</div>
  <button id="restart-btn">New Game</button>
  <div id="license">
      <a href="../../LICENSE.txt">MIT License</a>
  </div>
</div>

<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board, gameOver, playerTurn;
let wins = 0, losses = 0, draws = 0;

function updateRecord() {
  document.getElementById('record').textContent = `Record: ${wins}-${losses}-${draws}`;
}

function init() {
  board = Array(9).fill(null);
  gameOver = false;
  playerTurn = true;
  render();
  setStatus('', 'Your Turn');
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (v ? ' taken' : '');
    if (v) cell.innerHTML = `<span class="${v.toLowerCase()}">${v}</span>`;
    cell.addEventListener('click', () => onCellClick(i));
    grid.appendChild(cell);
  });
}

function setStatus(top, bottom) {
  document.getElementById('status-top').textContent = top;
  document.getElementById('status-bottom').textContent = bottom;
}

function checkWinner(b) {
  for (const [a,c,d] of WINS) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a,c,d] };
  }
  if (b.every(v => v)) return { winner: 'draw' };
  return null;
}

function highlightWin(line) {
  const cells = document.getElementById('grid').children;
  line.forEach(i => cells[i].classList.add('win-line'));
}

function onCellClick(i) {
  if (!playerTurn || gameOver || board[i]) return;
  board[i] = 'X';
  render();
  const res = checkWinner(board);
  if (res) {
    gameOver = true;
    if (res.winner === 'X') { wins++; updateRecord(); highlightWin(res.line); setStatus('', 'You win! 🎉'); }
    else { draws++; updateRecord(); setStatus('', "It's a draw!"); }    return;
  }
  playerTurn = false;
  setStatus('Thinking...', '');
  setTimeout(doComputerMove, 1000);
}

function doComputerMove() {
  if (gameOver) return;
  const move = Math.random() < 0.9 ? bestMove() : randomMove();
  board[move] = 'O';
  render();
  const res = checkWinner(board);
  if (res) {
    gameOver = true;
    if (res.winner === 'O') { losses++; updateRecord(); highlightWin(res.line); setStatus('', 'Computer wins!'); }
    else { draws++; updateRecord(); setStatus('', "It's a draw!"); }    return;
  }
  playerTurn = true;
  setStatus('', 'Your Turn');
}

function randomMove() {
  const avail = board.map((v,i) => v ? null : i).filter(v => v !== null);
  return avail[Math.floor(Math.random() * avail.length)];
}

function bestMove() {
  let best = -Infinity, move = -1;
  board.forEach((v, i) => {
    if (!v) {
      board[i] = 'O';
      const s = minimax(board, 0, false);
      board[i] = null;
      if (s > best) { best = s; move = i; }
    }
  });
  return move;
}

function minimax(b, depth, isMax) {
  const res = checkWinner(b);
  if (res) {
    if (res.winner === 'O') return 10 - depth;
    if (res.winner === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    b.forEach((v, i) => {
      if (!v) { b[i] = 'O'; best = Math.max(best, minimax(b, depth+1, false)); b[i] = null; }
    });
    return best;
  } else {
    let best = Infinity;
    b.forEach((v, i) => {
      if (!v) { b[i] = 'X'; best = Math.min(best, minimax(b, depth+1, true)); b[i] = null; }
    });
    return best;
  }
}

document.getElementById('restart-btn').addEventListener('click', init);
init();
</script>
